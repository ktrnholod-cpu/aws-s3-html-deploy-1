name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::208937956131:role/GitHubActionsS3DeployRole
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://ТВОЙ_BUCKET_NAME \
            --exclude ".git/*" \
            --exclude ".github/*"
