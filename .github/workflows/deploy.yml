name: Deploy HTML to AWS S3 with CloudWatch Monitoring

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: jekaterina-html-deploy-2026
  CLOUDWATCH_NAMESPACE: StudentDeployments
  APP_NAME: aws-s3-html-deploy

jobs:
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::208937956131:role/GitHubActionsS3DeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy files to S3
        id: s3_deploy
        continue-on-error: true
        run: |
          aws s3 sync . s3://FAKE-BUCKET-NAME-TO-PROVOKE-DEPLOY \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Send success metric to CloudWatch
        if: steps.s3_deploy.outcome == 'success'
        run: |
          aws cloudwatch put-metric-data \
            --namespace "${{ env.CLOUDWATCH_NAMESPACE }}" \
            --metric-name DeploySuccess \
            --value 1 \
            --unit Count \
            --dimensions AppName=${{ env.APP_NAME }},Environment=dev

      - name: Send failure metric to CloudWatch
        if: steps.s3_deploy.outcome == 'failure'
        run: |
          aws cloudwatch put-metric-data \
            --namespace "${{ env.CLOUDWATCH_NAMESPACE }}" \
            --metric-name DeployFailure \
            --value 1 \
            --unit Count \
            --dimensions AppName=${{ env.APP_NAME }},Environment=dev

      # Финальный штрих: если деплой упал, мы принудительно завершаем воркфлоу со статусом "ошибка",
      # чтобы в самом GitHub Actions пайплайн горел красным, как и положено.
      - name: Check deploy status and fail if needed
        if: steps.s3_deploy.outcome == 'failure'
        run: exit 1
